AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly meetings report - SQS queue, S3 bucket with gateway endpoint,
  EventBridge Scheduler, Builder Lambda (in VPC) and Mailer Lambda (outside VPC).

Parameters:
  ProjectName:
    Type: String
    Default: demo-meetings
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from backend stack
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets where Aurora lives
  RouteTableIds:
    Type: List<String>
    Description: Route table IDs of the private subnets (for S3 Gateway Endpoint)
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to connect to Aurora
  BackendImageUri:
    Type: String
    Description: Full ECR image URI of the backend
  DatabaseEndpoint:
    Type: String
    Default: demo-meetings-db.cluster-c4d0msukmeld.us-east-1.rds.amazonaws.com
  DBUser:
    Type: String
    Default: meetings
  DBName:
    Type: String
    Default: meetings
  DBPassword:
    Type: String
    NoEcho: true
  SenderEmail:
    Type: String
    Description: Verified email address or reports@yourdomain
  RecipientEmail:
    Type: String
    Description: Your verified email address

Resources:
  # ---------------------------------------------------------------- S3 & Endpoint
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "reports/"
                  - Name: suffix
                    Value: ".csv"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # ---------------------------------------------------------------- SQS & DLQ
  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------- Builder Lambda
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: S3PutReports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-builder
      PackageType: Image
      Code:
        ImageUri: !Ref BackendImageUri
      ImageConfig:
        EntryPoint: ["python", "-m", "awslambdaric"]
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [arm64]
      Timeout: 120
      MemorySize: 512
      Role: !GetAtt BuilderRole.Arn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+asyncpg://${DBUser}:${DBPassword}@${DatabaseEndpoint}:5432/${DBName}
          REPORTS_BUCKET: !Ref ReportsBucket
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderSqsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1

  # ---------------------------------------------------------------- EventBridge Scheduler
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-schedule
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # ---------------------------------------------------------------- Mailer Lambda
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-mailer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          import os
          import boto3
          import logging
          import urllib.parse
          from email.message import EmailMessage

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          s3 = boto3.client('s3')
          ses = boto3.client('sesv2')

          def handler(event, context):
              record = event['Records'][0]
              bucket = record['s3']['bucket']['name']
              key = urllib.parse.unquote_plus(record['s3']['object']['key'])

              logger.info(f"report-mailer triggered trigger=s3 bucket={bucket} key={key}")

              response = s3.get_object(Bucket=bucket, Key=key)
              csv_data = response['Body'].read()

              filename = os.path.basename(key)
              sender = os.environ['SENDER_EMAIL']
              recipient = os.environ['RECIPIENT_EMAIL']

              msg = EmailMessage()
              msg['Subject'] = f"Weekly meetings report {filename.replace('.csv', '')}"
              msg['From'] = sender
              msg['To'] = recipient
              msg.set_content("Please find attached the weekly meetings report.")
              msg.add_attachment(csv_data, maintype="text", subtype="csv", filename=filename)

              ses.send_email(
                  Content={'Raw': {'Data': msg.as_bytes()}}
              )
              return {'status': 'sent', 'key': key}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

Outputs:
  QueueUrl:
    Value: !Ref ReportRequestsQueue
  BucketName:
    Value: !Ref ReportsBucket
