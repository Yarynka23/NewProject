AWSTemplateFormatVersion: "2010-09-09"
Description: Paste an agenda - parser Lambda (Amazon Nova via Bedrock Converse)

Parameters:
  ProjectName:
    Type: String
  ImageUri:
    Type: String
    Description: URI образу бекенду в ECR (той самий, що в Lab 5)
  ParserModel:
    Type: String
    Default: us.amazon.nova-pro-v1:0
  UserPoolId:
    Type: String
  SiteOrigin:
    Type: String
    Description: Адреса сайту без слеша в кінці

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["python", "-m", "awslambdaric"]
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [arm64]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          COGNITO_REGION: !Ref AWS::Region
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ParserUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn: !Ref ParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Ref SiteOrigin
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
          - authorization

  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ParserUrl:
    Description: Function URL парсера (вставити у фронтенд як PARSER_URL)
    Value: !GetAtt ParserUrl.FunctionUrl
